name: Commercial licence request
description: Ask about a commercial licence for company, client or product use.
title: "[Commercial licence]"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for asking rather than guessing.

        Personal, educational, research, charitable and government use needs no licence. A commercial licence covers a company using this software for its own business, or shipping it inside something it sells. [What a commercial licence grants](../blob/main/docs/COMMERCIAL.md) has the full picture.

        Please include only what is needed to price it — no confidential material and no personal data. If something has to stay private, say so and we will move to a private channel first.
  - type: dropdown
    id: how-used
    attributes:
      label: How would it be used?
      description: Pick the closest one; detail can go in the box further down.
      options:
        - Internal use — our own documents, our own staff
        - Embedded in a product or service we sell
        - A paid platform we operate for other organisations
        - Delivering paid client work (consultancy, agency, legal)
        - Evaluation before deciding
        - Something else — described below
    validations:
      required: true
  - type: input
    id: headcount
    attributes:
      label: Roughly how many people would use it?
      placeholder: e.g. 5, or 200 across two subsidiaries
    validations:
      required: true
  - type: input
    id: organisation
    attributes:
      label: Organisation
      description: Optional. Company, institution or client name — leave blank if you would rather not say yet.
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Anything else that affects the licence
      description: Multiple legal entities, redistribution to customers, an air-gapped deployment, an invoicing requirement, a procurement process to follow. All of it is useful.
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: I understand this issue is public and I have not included confidential or personal information in it.
          required: true
